openapi: 3.0.3

info:
  title: QueryRunner API
  version: "2.2.0"
  description: >
    QueryRunner API, SQL Server üzerinde güvenli ve kontrollü sorgu yürütmek için
    geliştirilmiş FastAPI tabanlı bir servistir.

    API, JWT tabanlı authentication, tarih aralıklı sorgular, statik sorgular,
    güvenli raw SQL (SELECT/WITH/EXEC) çalıştırma ve MailLogger ile e-mail log
    gönderimi özelliklerini destekler.

    ⚠️ Güvenlik Notu:
    DDL ve DML komutları (INSERT, UPDATE, DELETE, DROP, ALTER, TRUNCATE vb.)
    otomatik olarak engellenir ve tüm denemeler MailLogger aracılığıyla loglanır.

servers:
  - url: http://78.189.179.50:17487
    description: Production Docker Server (On-Prem)

tags:
  - name: Auth
    description: JWT tabanlı kullanıcı doğrulama
  - name: Query
    description: Kayıtlı SQL sorgularını çalıştıran endpointler
  - name: Raw SQL
    description: >
      Güvenli SELECT / WITH tabanlı SQL yürütme.
      DDL/DML komutları otomatik olarak engellenir ve loglanır.
  - name: System
    description: Sistem ve sağlık kontrolü endpointleri

paths:
  /:
    get:
      summary: Health Check
      description: Sunucunun aktif olup olmadığını doğrular.Herhangi bir kimlik doğrulaması gerektirmez.
      tags: [System]
      responses:
        "200":
          description: API çalışıyor
          content:
            application/json:
              example:
                message: "QueryRunner API is running 🚀"

  /auth/login:
    post:
      summary: Bu endpoint, kullanıcı adı ve şifre bilgilerini doğrulayarak JWT tabanlı bir access token üretir.Üretilen token, API’deki korumalı endpointlere erişim için kullanılır.
      description: >
        Başarılı giriş sonrası token **Bearer <token>** formatında döner.
        Bu token tüm korumalı endpointlerde Authorization header içinde kullanılmalıdır.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: test_user
                password:
                  type: string
                  example: test_password
      responses:
        "200":
          description: JWT token başarıyla üretildi
          content:
            application/json:
              example:
                access_token: "Bearer eyJhbGciOiJIUzI1NiIsInR..."
                token_type: bearer
        "401":
          description: Kullanıcı adı veya şifre hatalı

  /query/:
    post:
      summary: Bu endpoint, sistemde önceden bir tabloda kaydedilmiş SQL sorgularını çalıştırır.Kayıtlı SQL Sorguları tarih aralıkları içerir. Kullanıcıdan alınan tarih aralığına göre kayıtlı SQL Sorguları güncellenir ve çalıştırılır.
      tags: [Query]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: string
                  example: ["Net_Satışlar"]
                Tarih:
                  type: string
                  description: "Örnek: 02.01.2025 ile 31.08.2025"
                  example: "02.01.2025 ile 31.08.2025"
      responses:
        "200":
          description: Başarılı
          content:
            application/json:
              example:
                user_id: 12
                items: ["Net_Satışlar"]
                result:
                  Net_Satışlar: 1500000
        "401":
          description: Token geçersiz
  /query/query:
    post:
      summary: Tarih aralığına göre seçilen finansal kalemleri hesaplar
      description: >
        Bu endpoint, kullanıcı tarafından gönderilen **finansal kalem (item) listesi**
        ve **tarih aralığı** bilgisini kullanarak, sistemde önceden tanımlı
        SQL ve hesaplama kurallarını çalıştırır ve **hesaplanmış finansal sonuçlar**
        döndürür.

        Çalışma adımları:

        1. Kullanıcı JWT token üzerinden doğrulanır ve `user_id` belirlenir.
        2. `items` alanında gönderilen her bir finansal kalem için:
           - İlgili SQL metni, backend’de bulunan kayıtlı SQL tablosundan
             (örn. `nly_sql_api`) alınır.
        3. `Tarih` alanı gönderilmişse:
           - "DD.MM.YYYY ile DD.MM.YYYY" formatındaki tarih aralığı parse edilir.
           - SQL içindeki sabit tarih ifadeleri (=`YYYY-MM-DD`, `YYYYMMDD`,
             `BETWEEN ... AND ...`) bu tarih aralığına göre otomatik olarak güncellenir.
        4. Bazı özel finansal kalemler için:
           - SQL içindeki sabit `365` / `180` değerleri,
             bitiş tarihinin yıl içindeki gün sayısına göre dinamik olarak değiştirilir.
           - Bu işlem; tahsil süresi, stok gün sayısı, nakit dönüşüm süresi gibi
             gün bazlı rasyolar için uygulanır.
        5. Güncellenmiş SQL güvenli şekilde çalıştırılır.
        6. Her sorgunun ilk satırındaki ilk kolon değeri alınarak,
           ilgili finansal kalemin sonucu olarak kaydedilir.
        7. Herhangi bir kalemde hata oluşursa:
           - Hata MailLogger üzerinden loglanır.
           - İlgili kalem için sonuç `null` olarak döndürülür.
        8. Tüm sonuçlar tek bir response altında birleştirilerek kullanıcıya iletilir.

        Bu endpoint:
        -  Raw SQL kabul etmez
        -  Kullanıcıdan hesaplama mantığı almaz
        -  Sadece sistemde tanımlı ve güvenli SQL/hafıza alınmış kuralları çalıştırır

        Amaç:
        - Finansal rasyoların ve özet kalemlerin
          **tutarlı, denetlenebilir ve otomatik** şekilde hesaplanmasını sağlamaktır.
      tags: [Query]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, Tarih]
              properties:
                items:
                  type: array
                  description: >
                    Hesaplanması istenen finansal kalemlerin listesi.
                    Her bir değer backend’de tanımlı bir hesaplama anahtarına karşılık gelir.
                  items:
                    type: string
                  example:
                    - "Dönen_Varlıklar"
                    - "Net_Satışlar"
                    - "Brut_Kar_Marjı"
                Tarih:
                  type: string
                  description: >
                    Doğal dil formatında tarih aralığı.
                    Örnek format: "02.01.2025 ile 30.09.2025"
                  example: "02.01.2025 ile 30.09.2025"
      responses:
        "200":
          description: Finansal kalemler başarıyla hesaplandı
          content:
            application/json:
              example:
                success: true
                requestId: "32cb66c9-f71b-4d4e-85fa-403421c7b3fc"
                status: 200
                statusText: "OK"
                data:
                  user_id: 3
                  items:
                    - "Dönen_Varlıklar"
                    - "Kısa_Vadeli_Borçlar"
                    - "Net_Dönem_Karı"
                    - "Net_Satışlar"
                    - "Ortalama_Ticari_Alacaklar"
                    - "Toplam_Borçlar"
                    - "Toplam_Varlıklar"
                    - "Stok"
                    - "Alacak Devir Hızı"
                    - "Brut_Kar_Marjı"
                    - "Stok Devir Hızı"
                    - "Tahsil Süresi (gün)"
                    - "Stok Gün Sayısı"
                    - "Ozkaynak_Durumu"
                    - "Borc_Odeme_Suresi"
                    - "Nakit_Donusum_Suresi"
                    - "Faaliyet_Kar_Marjı"
                    - "Borç/Özkaynak"
                    - "Kısa Vadeli Borç/Toplam Borç"
                  result:
                    Dönen_Varlıklar: 246238742.95
                    Kısa_Vadeli_Borçlar: -125227968.93
                    Net_Dönem_Karı: -54914299.56
                    Net_Satışlar: -436818681.62
                    Ortalama_Ticari_Alacaklar: 76240486.995
