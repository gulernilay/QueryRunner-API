  /query/v2/run-basic:
    post:
      summary: Kayıtlı statik SQL sorgusunu key ile çalıştırır
      description: >
        Bu endpoint, sistemde bir tabloda **key → SQL** eşlemesi olarak saklanan **tarihsiz (statik)** sorguları çalıştırır.Kullanıcı yalnızca bir **key** gönderir; backend ilgili SQL’i güvenli şekilde bulur ve çalıştırır. Bu endpoint, **parametre gerektirmeyen raporlar**, **özet tablolar** ve **referans listeleri** gibi senaryolar için tasarlanmıştır.
        Not:
        - Sorgu bulunamazsa **404** döner.
        - Bu endpoint raw SQL kabul etmez; yalnızca kayıtlı sorguları çalıştırır.
      tags: [Query]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: >
                    Çalıştırılacak kayıtlı SQL sorgusunun anahtarı (key).
                    Bu değer, backend’de key→SQL eşlemesi olan tabloda aranır.
                  example: IK_Aylik_Ozet
      responses:
        "200":
          description: Sorgu başarıyla çalıştırıldı
          content:
            application/json:
              example:
                user_id: 12
                key: IK_Aylik_Ozet
                rowcount: 24
                data:
                  - Departman: "Sos İşletme"
                    PersonelSayisi: 18
        "404":
          description: Gönderilen key için kayıtlı bir SQL sorgusu bulunamadı
        "401":
          description: Token geçersiz

  /query/query_automatized:
    post:
      summary: >
        Otomatik finansal rapor ve rasyo sorgusu çalıştırır.Tarih aralığı sistem tarafından otomatik olarak belirlenir.
      description: >
        Bu endpoint, **otomatik finansal rasyo ve özet raporları** üretmek için tasarlanmıştır.

        Çalışma mantığı:
        - Sistem, çalıştırıldığı günü **bitiş tarihi** olarak alır
        - Başlangıç tarihi, tanımlı iş kuralına göre otomatik belirlenir
        - Kullanıcıdan **tarih aralığı alınmaz**
        - Kayıtlı finansal kalemler otomatik olarak çalıştırılır

        Bu endpoint özellikle:
        - Günlük / aylık otomatik rapor mailleri
        - LLM tabanlı agent’lar
        - Zamanlanmış finansal özetler için kullanılır.

        Raw SQL çalıştırmaz.  
        Sadece sistemde tanımlı ve güvenli finansal senaryoları çalıştırır.
      tags: [Query]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                  description: >
                    Otomatik raporu tetikleyen doğal dil komutu.
                    İçerik serbesttir, tarih bilgisi beklenmez.
                  example: "finansal rasyo raporu oluştur"
                context:
                  type: object
                  nullable: true
                  description: >
                    Opsiyonel bağlamsal bilgiler.
                    (Kullanıcı rolü, rapor tipi, departman vb.)
                  example:
                    role: "finance"
                    report_type: "daily"
      responses:
        "200":
          description: Otomatik finansal rapor başarıyla oluşturuldu
          content:
            application/json:
              example:
                success: true
                requestId: "1a42d43e-42f8-4c3b-88f7-55e965cc58a7"
                status: 200
                statusText: "OK"
                data:
                  user_id: 3
                  auto_date_range: "01.01.2026 ile 04.01.2026"
                  items:
                    - "Dönen_Varlıklar"
                    - "Kısa_Vadeli_Borçlar"
                    - "Net_Dönem_Karı"
                    - "Net_Satışlar"
                    - "Ortalama_Ticari_Alacaklar"
                    - "Toplam_Borçlar"
                    - "Toplam_Varlıklar"
                    - "Stok"
                    - "Alacak Devir Hızı"
                    - "Brut_Kar_Marjı"
                    - "Stok Devir Hızı"
                    - "Tahsil Süresi (gün)"
                    - "Stok Gün Sayısı"
                    - "Ozkaynak_Durumu"
                    - "Borc_Odeme_Suresi"
                    - "Nakit_Donusum_Suresi"
                    - "Faaliyet_Kar_Marjı"
                    - "Borç/Özkaynak"
                    - "Kısa Vadeli Borç/Toplam Borç"
                  results:
                    Dönen_Varlıklar: null
                    Kısa_Vadeli_Borçlar: null
                    Net_Dönem_Karı: null
                    Net_Satışlar: null
                    Ortalama_Ticari_Alacaklar: null
                    Toplam_Borçlar: null
                    Toplam_Varlıklar: null
                    Stok: null
                    Alacak Devir Hızı: null
                    Brut_Kar_Marjı: null
                    Stok Devir Hızı: null
                    Tahsil Süresi (gün): null
                    Stok Gün Sayısı: null
                    Ozkaynak_Durumu: null
                    Borc_Odeme_Suresi: null
                    Nakit_Donusum_Suresi: null
                    Faaliyet_Kar_Marjı: null
                    Borç/Özkaynak: null
                    Kısa Vadeli Borç/Toplam Borç: null
        "400":
          description: >
            Otomatik rapor senaryosu oluşturulamadı veya iş kuralı hatası oluştu
        "401":
          description: Token geçersiz
        "500":
          description: Sunucu hatası

  /query/raw/run-sql:
    post:
      summary: RAW SQL çalıştırır (SELECT / WITH / EXEC)
      description: >
        Bu endpoint yalnızca SELECT, WITH (CTE) ve EXEC ifadeleri ile başlayan SQL komutlarını kabul eder.Tek bir sorgu veya birden fazla sorgu (SQL listesi) gönderilebilir.Çoklu SQL kullanımı, özellikle **analiz ve raporlama senaryolarında**,farklı view veya CTE’lerden gelen verilerin **tek API çağrısı ile** toplanmasını sağlar.❌ INSERT, UPDATE, DELETE, DROP, ALTER, TRUNCATE, MERGE gibi
        DDL/DML komutları otomatik olarak engellenir ve MailLogger ile loglanır.
      tags: [Raw SQL]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: >
                    Tek SQL veya SQL listesi.
                    SQL listesi kullanımı, analiz raporlarında farklı view’lardan veya CTE’lerden gelen verilerin **tek seferde çağrılması** için tasarlanmıştır.Sadece SELECT / WITH / EXEC ifadeleri kabul edilir.
                note:
                  type: string
                  nullable: true
                  description: >
                    Opsiyonel log açıklaması.Özellikle rapor veya analiz senaryolarında bağlam bilgisi vermek için kullanılır.
            examples:
              single_sql:
                summary: Tek SQL çalıştırma
                description: >
                  Tek bir SELECT sorgusu çalıştırır.Basit veri çekme veya tek tablo/view sorguları için kullanılır.
                value:
                  sql: "SELECT TOP 10 Name, Age FROM ChefsAI.dbo.Users"
                  note: "Kullanıcı listesi test sorgusu"

              multiple_sql:
                summary: Analiz / rapor amaçlı çoklu SQL çalıştırma
                description: >
                  Analiz raporu oluştururken, farklı view’lardan veya CTE’lerden gelen verilerin tek API çağrısında toplanmasını sağlar.Sorgular sıralı olarak çalıştırılır ve sonuçlar index bazlı döndürülür.
                value:
                  sql:
                    - "SELECT COUNT(*) AS UserCount FROM ChefsAI.dbo.Users"
                    - "WITH CTE AS (SELECT Age FROM ChefsAI.dbo.Users) SELECT AVG(Age) AS AvgAge FROM CTE"
                    - "EXEC dbo.sp_GetActiveUsers"
                  note: "Kullanıcı analiz raporu – çoklu veri kaynağı"
      responses:
        "200":
          description: Sorgu(lar) başarıyla çalıştırıldı
          content:
            application/json:
              examples:
                single_result:
                  summary: Tek SQL sonucu
                  value:
                    user_id: 12
                    results:
                      - index: 0
                        columns: ["Name", "Age"]
                        rowcount: 2
                        rows:
                          - { "Name": "Nilay", "Age": 28 }
                          - { "Name": "Ayşe", "Age": 29 }

                multiple_result:
                  summary: Analiz raporu için çoklu SQL sonucu
                  value:
                    user_id: 12
                    results:
                      - index: 0
                        columns: ["UserCount"]
                        rowcount: 1
                        rows:
                          - { "UserCount": 245 }
                      - index: 1
                        columns: ["AvgAge"]
                        rowcount: 1
                        rows:
                          - { "AvgAge": 31 }
                      - index: 2
                        columns: ["UserId", "UserName"]
                        rowcount: 3
                        rows:
                          - { "UserId": 1, "UserName": "Nilay" }
                          - { "UserId": 2, "UserName": "Ayşe" }
                          - { "UserId": 3, "UserName": "Mehmet" }

        "400":
          description: SELECT / WITH / EXEC dışındaki SQL komutları yasaktır
        "401":
          description: Token geçersiz
        "500":
          description: Sunucu hatası
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
