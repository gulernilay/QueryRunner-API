name: Deploy QueryRunner API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on Windows Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd C:\Users\nilay.guler\Desktop\QueryRunner-API_

            docker stop queryrunner || true
            docker rm queryrunner || true

            docker build -t queryrunner-api:latest .

            docker run -d --name queryrunner ^
              -p 8275:8000 ^
              --env-file .env ^
              queryrunner-api:latest
          EOF
